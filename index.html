<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laurea di Angela Mazzella 🎓</title>
<meta name="description" content="Un piccolo ricordo della laurea di Angela Mazzella">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --rosso:#8b1e2d;
    --rosso2:#b83246;
    --oro:#c5a253;
    --oro2:#e7cf92;
    --avorio:#fbf7ef;
    --avorio2:#efe2c7;
    --testo:#2d2325;
    --muted:#756064;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    font-family:"Inter",sans-serif;
    color:var(--testo);
    background:
        radial-gradient(circle at top, #fffdf8 0%, var(--avorio) 42%, var(--avorio2) 100%);
    min-height:100vh;
    overflow-x:hidden;
}

body.intro-open{overflow:hidden}

/* INTRO */
.intro{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
        radial-gradient(circle at center, rgba(181,35,50,.18), transparent 45%),
        linear-gradient(145deg,#fbf7ef,#f3e7cf);
    transition:opacity .9s ease, visibility .9s ease;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
}

.intro-inner{
    text-align:center;
    max-width:620px;
    animation:introIn 1s ease both;
}

.intro-laurel{
    font-size:50px;
    letter-spacing:8px;
    margin-bottom:18px;
}

.intro-date{
    color:var(--rosso);
    text-transform:uppercase;
    letter-spacing:4px;
    font-weight:700;
    font-size:13px;
}

.intro h2{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(44px,8vw,82px);
    line-height:.95;
    margin:16px 0 14px;
    color:var(--rosso);
}

.intro p{
    margin:0;
    color:var(--muted);
    font-size:17px;
}

@keyframes introIn{
    from{opacity:0;transform:translateY(18px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* CORIANDOLI NATURALI */
const confettiCanvas = document.getElementById("confetti-canvas");
const confettiCtx = confettiCanvas.getContext("2d");

let confettiPieces = [];
let confettiAnimationId = null;

const confettiColors = [
    "#8b1e2d",
    "#b83246",
    "#c5a253",
    "#efd58f",
    "#ffffff"
];

function resizeConfettiCanvas(){
    const ratio = window.devicePixelRatio || 1;

    confettiCanvas.width = window.innerWidth * ratio;
    confettiCanvas.height = window.innerHeight * ratio;

    confettiCanvas.style.width = window.innerWidth + "px";
    confettiCanvas.style.height = window.innerHeight + "px";

    confettiCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

window.addEventListener("resize", resizeConfettiCanvas);
resizeConfettiCanvas();

function createConfettiPiece(index){
    const centerBias = Math.random();

    return {
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * 180,

        // Piccolo movimento laterale, senza traiettorie assurde.
        vx: (Math.random() - 0.5) * 1.4,

        // Velocità iniziale verticale diversa per ogni pezzo.
        vy: 0.6 + Math.random() * 1.7,

        gravity: 0.035 + Math.random() * 0.025,
        drag: 0.998,

        width: 6 + Math.random() * 7,
        height: 10 + Math.random() * 9,

        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.10,

        sway: 0.35 + Math.random() * 0.8,
        swaySpeed: 0.015 + Math.random() * 0.025,
        swayOffset: Math.random() * Math.PI * 2,

        color: confettiColors[
            Math.floor(Math.random() * confettiColors.length)
        ],

        opacity: 0.95,
        age: 0,
        delay: Math.random() * 55
    };
}

function launchConfetti(){
    if(confettiAnimationId){
        cancelAnimationFrame(confettiAnimationId);
    }

    confettiPieces = [];

    for(let i = 0; i < 120; i++){
        confettiPieces.push(createConfettiPiece(i));
    }

    animateConfetti();
}

function animateConfetti(){
    confettiCtx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    let stillVisible = false;

    confettiPieces.forEach(piece => {
        if(piece.delay > 0){
            piece.delay--;
            stillVisible = true;
            return;
        }

        piece.age++;

        // Caduta naturale: accelerazione verso il basso.
        piece.vy += piece.gravity;

        // Leggerissima resistenza dell'aria.
        piece.vx *= piece.drag;

        // Oscillazione laterale morbida.
        const sway =
            Math.sin(piece.age * piece.swaySpeed + piece.swayOffset)
            * piece.sway;

        piece.x += piece.vx + sway;
        piece.y += piece.vy;

        piece.rotation += piece.rotationSpeed;

        // Dissolvenza solo quando è quasi fuori dallo schermo.
        if(piece.y > window.innerHeight * 0.82){
            piece.opacity -= 0.018;
        }

        if(
            piece.opacity > 0 &&
            piece.y < window.innerHeight + 60
        ){
            stillVisible = true;
        }

        confettiCtx.save();

        confettiCtx.globalAlpha = Math.max(piece.opacity, 0);

        confettiCtx.translate(piece.x, piece.y);
        confettiCtx.rotate(piece.rotation);

        confettiCtx.fillStyle = piece.color;

        confettiCtx.fillRect(
            -piece.width / 2,
            -piece.height / 2,
            piece.width,
            piece.height
        );

        confettiCtx.restore();
    });

    if(stillVisible){
        confettiAnimationId = requestAnimationFrame(animateConfetti);
    }else{
        confettiCtx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );
    }
}
</script>

</body>
</html>
